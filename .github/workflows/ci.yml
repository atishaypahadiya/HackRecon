# Tests, typecheck and extension build on every PR and every push to main (user 2026-11-07). main requires the
# "check" job to pass before a merge. Workspace data is never tracked (D10), so suites built on it skip here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit -p .
      - run: bun run build:ext
