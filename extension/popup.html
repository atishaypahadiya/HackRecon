<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 260px; margin: 12px; }
      button { width: 100%; padding: 8px; font: inherit; cursor: pointer; }
      fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 12px 0 8px; padding: 6px 8px; }
      legend { padding: 0 4px; }
      label { display: block; margin: 2px 0; }
      .status { margin-top: 8px; color: #555; }
    </style>
  </head>
  <body>
    <button id="sync">Sync this event</button>
    <div id="sync-status" class="status">Captures the sponsor and announcement channels and their threads. Leave the Slack tab open and visible until it finishes.</div>

    <button id="capture" style="margin-top:12px">Capture this channel</button>
    <div id="status" class="status"></div>

    <fieldset>
      <legend>Can anyone open this page without logging in?</legend>
      <label><input type="radio" name="access" value="public" /> Yes, it's public</label>
      <label><input type="radio" name="access" value="authenticated" /> No, I'm logged in to see it</label>
    </fieldset>
    <button id="capture-page" disabled>Capture this page</button>
    <div id="page-status" class="status">Pick one first. Logged-in pages are redacted before any model sees them.</div>
    <script src="dist/popup.js"></script>
  </body>
</html>
